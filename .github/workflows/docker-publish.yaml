name: Build and Push React Docker Image

on:
  push:
    branches:
      - main
    # paths:
    #   - "homewoek_react_001/**"
    #   - ".github/workflows/docker-publish.yaml"

  workflow_dispatch:

jobs:
  docker:
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          # context: ./homewoek_react_001
          # file: ./homewoek_react_001/Dockerfile
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/homework-react:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/homework-react:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
